<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Mapper</title>
    <link rel="stylesheet" href="logMapper.css" />
</head>
<body>
    <main id="log-mapper-app">
        <section id="log-picker" aria-label="Log picker">
            <div id="log-picker-card">
                <h1 id="log-picker-title">Choose a Log</h1>
                <p id="log-picker-subtitle">Select a capture to open the map view.</p>
                <div id="log-picker-list">Loading logs...</div>
            </div>
        </section>

        <section id="map-view" aria-label="Log map view">
            <div id="map-wrap">
                <img id="map-image" src="public/Icons/map_simple.png" alt="World map background" />
                <svg id="overlay" aria-hidden="true"></svg>
            </div>

            <div id="status" role="status">Choose a log to begin.</div>

            <nav id="zoom-controls" aria-label="Map controls">
                <button id="back-to-picker" type="button">Choose Log</button>
                <button id="zoom-in" type="button">+</button>
                <button id="zoom-out" type="button">-</button>
                <button id="zoom-reset" type="button">Reset</button>
            </nav>

            <aside id="inspector" class="hidden">
                <h3>Inspector</h3>
                <div id="inspector-content" class="muted">Click a colored point to inspect its route.</div>
            </aside>
        </section>
    </main>

    <script src="logMapper.js"></script>
</body>
</html>
